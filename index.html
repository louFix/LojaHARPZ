<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpz</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header class="topo">
        <div class="topo-principal">
            <a href="#" class="logo">Harpz</a>
            
            <form class="busca" action="#">
                <input type="text" placeholder="Buscar produtos, marcas e muito mais...">
                <button type="submit">Pesquisar</button>
            </form>

            <span class="promo">Frete grátis na 1ª compra</span>
        </div>

        <nav class="menu">
            <a href="#" class="local">📍 Enviar para São Paulo</a>

            <ul class="categorias">
                <li><a href="#">Categorias</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="#">Periféricos</a></li>
                <li><a href="#">Eletrônicos</a></li>
                <li><a href="#">Ajuda</a></li>
            </ul>

            <ul class="usuario">
                <li><a href="#">Crie a sua conta</a></li>
                <li><a href="#">Entre</a></li>
                <li><a href="#">Compras</a></li>
                <li>
                    <button class="btn-carrinho" type="button" aria-label="Carrinho de compras">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="9" cy="20" r="1.5"></circle>
                            <circle cx="18" cy="20" r="1.5"></circle>
                            <path d="M2 3h3l2.7 12.4a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6"></path>
                        </svg>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-conteudo">
            <h2>Sua primeira compra com frete grátis</h2>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
