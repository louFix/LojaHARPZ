<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="topo">

        <a href="/pagina index/index.html" class="logo">Harpz</a>

    </header>

    <main class="area-cadastro">

        <section class="caixa-cadastro">
            <h1>Criar sua conta HARPZ</h1>

            <p class="subtitulo">
                cadastre-se para começar a comprar na Harpz.
            </p>

            <form id="formCadastro"> 
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required>
                </div>

                <div class="termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Eu aceito os termos e condições da harpz.</label>
                </div>

                <button type="submit" class="btn-cadastrar">
                    criar uma conta
                </button>

            </form>

            <p class="login">
                Já tem uma conta?
                <a href="/pagina index/index.html">Entre</a>
            </p>
                
        </section>

    </main>
    
</body>
</html>
